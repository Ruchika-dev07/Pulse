[env:feathers3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = um_feathers3
framework = arduino

monitor_speed = 115200
upload_speed = 115200
upload_flags =
    --before=default_reset
    --after=hard_reset

; Force PSRAM off so GPIO35/36/37 stay usable as Feather SPI silk.
board_build.arduino.memory_type = qio_qspi
build_unflags = -DBOARD_HAS_PSRAM
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

lib_ldf_mode = deep+

lib_deps =
    bblanchon/ArduinoJson@^7
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    sparkfun/SparkFun ATECCX08a Arduino Library