[env:feathers3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = um_feathers3
framework = arduino
monitor_speed = 115200

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src

lib_ldf_mode = deep+

lib_deps =
    bblanchon/ArduinoJson@^7
    sparkfun/SparkFun Qwiic OLED Arduino Library
    sparkfun/SparkFun ATECCX08a Arduino Library